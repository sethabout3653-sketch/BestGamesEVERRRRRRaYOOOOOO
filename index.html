<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://tungtung.coosemansla.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to hold the infinite load state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    // ==========================================
    // 1. ACTIVE FEED INFINITE SPINNER (LAG-FREE)
    // ==========================================
    (function maintainInfiniteSpinner() {
      const loader = document.getElementById('infinite-loader');
      let writeInterval;

      function startActiveStream() {
        // Clear any existing loops
        if (writeInterval) clearInterval(writeInterval);

        try {
          const doc = loader.contentWindow.document;
          doc.open('text/html', 'replace');
          doc.write('<!DOCTYPE html><html><body>');
          
          // Actively feed the stream every 250ms. 
          // This prevents the browser from assuming the connection timed out.
          // Writing 15 bytes takes virtually 0% CPU, meaning absolutely zero lag.
          writeInterval = setInterval(() => {
            try {
              // If the user clicks the "Stop" (X) button, the browser forcefully sets readyState to 'complete'
              if (doc.readyState === 'complete') {
                startActiveStream(); // Instantly restart the stream
                return;
              }
              // Feed dummy data to keep the parser spinning the tab
              doc.write('<!-- active -->');
            } catch (err) {
              startActiveStream();
            }
          }, 250);

        } catch (e) {
          // Cross-origin fallback (failsafe)
        }
      }

      // Start the infinite stream immediately
      startActiveStream();

      // Detection Guard: Instantly restart if user clicks/types anything after hitting Stop
      ['mousedown', 'keydown', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, () => {
          try {
            if (loader.contentWindow.document.readyState === 'complete') {
              startActiveStream();
            }
          } catch(e) {}
        }, { passive: true });
      });
    })();

    // ==========================================
    // 2. TAB CLOSE / RELOAD PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      // Triggers the browser's default "Leave site?" prompt
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
