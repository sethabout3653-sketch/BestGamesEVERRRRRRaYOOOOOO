<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to force an ongoing loading state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    (function maintainInfiniteSpinner() {
      const loader = document.getElementById('infinite-loader');

      function keepPending() {
        try {
          // Open document stream inside iframe without calling doc.close()
          const doc = loader.contentWindow.document;
          doc.open('text/html', 'replace');
          doc.write('<!DOCTYPE html><html><head></head><body><!-- pending stream -->');
          // Intentionally omitting doc.close() keeps the parent network state pending
        } catch (e) {
          // Fallback: continuously re-trigger an unclosed data stream if cross-origin blocks document access
          const blob = new Blob(['<!DOCTYPE html><html><body>'], { type: 'text/html' });
          loader.src = URL.createObjectURL(blob);
        }
      }

      // Execute immediately before window.onload fires to lock the browser tab spinner state
      keepPending();

      // Periodically refresh stream every 3 seconds to ensure browser garbage collection doesn't drop the pending status
      setInterval(keepPending, 3000);
      
      // Re-engage if user switches back to tab
      window.addEventListener('focus', keepPending);
    })();
  </script>

</body>
</html>
