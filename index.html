<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to force an ongoing loading state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    // ==========================================
    // 1. HARDENED INFINITE TAB LOADING SPINNER
    // ==========================================
    (function maintainInfiniteSpinner() {
      const loader = document.getElementById('infinite-loader');

      function triggerPendingState() {
        try {
          // Open a dynamic document stream and deliberately leave it unclosed
          const doc = loader.contentWindow.document;
          doc.open('text/html', 'replace');
          doc.write('<!DOCTYPE html><html><head></head><body><!-- unclosed stream -->');
        } catch (e) {
          // Fallback via continuous blob stream injection
          const blob = new Blob(['<!DOCTYPE html><html><body>'], { type: 'text/html' });
          loader.src = URL.createObjectURL(blob);
        }
      }

      // Execute immediately to lock the tab spinner before initial page load completes
      triggerPendingState();

      // High-frequency ping (every 1 second) to instantly resume loading if the user hits "Stop" / "X"
      setInterval(triggerPendingState, 1000);

      // Instantly re-trigger on mouse movements, keypresses, clicks, and window focus
      // This catches the exact moment a user clicks the Stop button and interacts back with the page
      ['mousemove', 'mousedown', 'keydown', 'focus', 'touchstart'].forEach(eventType => {
        window.addEventListener(eventType, triggerPendingState, { passive: true });
      });
    })();

    // ==========================================
    // 2. TAB CLOSE / LEAVE PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      // Triggers browser prompt when attempting to close tab or reload
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
