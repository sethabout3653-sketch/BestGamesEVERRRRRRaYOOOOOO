<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to hold the infinite load state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    // ==========================================
    // 1. LIGHTWEIGHT INFINITE TAB SPINNER
    // ==========================================
    (function () {
      const loader = document.getElementById('infinite-loader');
      let currentBlobUrl = null;

      function startInfiniteLoad() {
        // Revoke previous URL object to prevent memory leaks
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }

        // Lightweight HTML blob requesting a non-existent SVG resource
        // Browsers keep the tab spinner active waiting for the resource stream
        const blob = new Blob([
          '<!DOCTYPE html><html><head></head><body>' +
          '<img src="data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'></svg>#pending">' +
          '</body></html>'
        ], { type: 'text/html' });

        currentBlobUrl = URL.createObjectURL(blob);
        loader.src = currentBlobUrl;
      }

      // Initial execution
      startInfiniteLoad();

      // Check state every 3 seconds (lightweight check, 0% CPU impact)
      setInterval(() => {
        try {
          if (loader.contentWindow.document.readyState === 'complete') {
            startInfiniteLoad();
          }
        } catch (e) {
          startInfiniteLoad();
        }
      }, 3000);

      // Instantly restart if user presses Stop or interacts with the page
      window.addEventListener('focus', startInfiniteLoad);
      window.addEventListener('click', startInfiniteLoad, { passive: true });
    })();

    // ==========================================
    // 2. TAB CLOSE / RELOAD PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
