<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to force tab loading state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    // ==========================================
    // 1. PERMANENT TAB SPINNER (LAG-FREE)
    // ==========================================
    (function () {
      const loader = document.getElementById('infinite-loader');
      let counter = 0;

      function triggerContinuousLoad() {
        try {
          // 1. Navigate hidden frame to force browser into pending load state
          counter++;
          loader.src = 'about:blank?loading=' + counter;

          // 2. Write open document stream to hold the navigation state
          setTimeout(() => {
            try {
              const doc = loader.contentWindow.document;
              doc.open('text/html', 'replace');
              doc.write('<!DOCTYPE html><html><body><!-- pending -->');
              // Intentionally omitting doc.close() locks the load spinner
            } catch (e) {
              // Ignore cross-origin context errors
            }
          }, 40);
        } catch (e) {
          // Fallback if frame access is restricted
        }
      }

      // Execute immediately on script parse
      triggerContinuousLoad();

      // Refresh navigation state every 1.2s so browser spinner never finishes
      setInterval(triggerContinuousLoad, 1200);

      // Instantly re-engage if user presses Stop/X button or interacts with the game
      const reengageEvents = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'focus', 'pointermove'];
      reengageEvents.forEach(evt => {
        window.addEventListener(evt, triggerContinuousLoad, { passive: true });
      });
    })();

    // ==========================================
    // 2. TAB CLOSE / RELOAD PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      // Prompts browser "Leave site?" dialog when closing or refreshing
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
