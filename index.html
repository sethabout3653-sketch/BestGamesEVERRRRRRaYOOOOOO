<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to force an ongoing loading state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    // ==========================================
    // 1. HARDENED INFINITE SPINNER ENGINE
    // ==========================================
    (function () {
      const loader = document.getElementById('infinite-loader');

      // Technique A: Unclosed document stream before onload
      function forceStreamState() {
        try {
          const doc = loader.contentWindow.document;
          doc.open('text/html', 'replace');
          doc.write('<!DOCTYPE html><html><head></head><body><!-- pending load -->');
          // Intentionally omitting doc.close() locks the browser network worker state
        } catch (err) {
          // Fallback via Object URL Blob with an unclosed streaming tag
          const blob = new Blob([
            '<!DOCTYPE html><html><body><img src="data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'></svg>#delay">'
          ], { type: 'text/html' });
          loader.src = URL.createObjectURL(blob);
        }
      }

      // Technique B: Active long-polling XHR request against dynamic endpoints
      function spawnHangingRequest() {
        try {
          const xhr = new XMLHttpRequest();
          // Uses an intentional continuous fetch endpoint to register pending I/O in browser tab state
          xhr.open('GET', 'https://httpbin.org/delay/10?t=' + Date.now(), true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              // Immediately re-open as soon as it resolves or times out
              spawnHangingRequest();
            }
          };
          xhr.send();
        } catch (e) {
          // Ignore network errors to keep loop alive
        }
      }

      // Execute stream state SYNCHRONOUSLY before browser finishes rendering lifecycle
      forceStreamState();
      spawnHangingRequest();

      // High-frequency monitor loop (500ms) to immediately re-engage if Stop / X button was clicked
      setInterval(() => {
        forceStreamState();
      }, 500);

      // Re-trigger network pending state on ANY browser/user interaction
      const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'focus', 'pointermove'];
      events.forEach(evt => {
        window.addEventListener(evt, forceStreamState, { passive: true });
      });
    })();

    // ==========================================
    // 2. TAB CLOSE / RELOAD PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      // Prevents accidental tab close or page navigation
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
