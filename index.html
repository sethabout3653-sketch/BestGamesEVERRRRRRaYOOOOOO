<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
    }
    /* Completely hidden background loader element */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to maintain an infinite tab loading spinner -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    function triggerInfiniteLoad() {
      const loader = document.getElementById('infinite-loader');
      
      try {
        // Reset src to force the frame context to re-evaluate
        loader.src = 'about:blank';
        
        setTimeout(() => {
          try {
            const doc = loader.contentWindow.document;
            doc.open();
            doc.write('<!DOCTYPE html><html><head></head><body></body></html>');
            // Deliberately omit doc.close() to keep the stream hanging open
          } catch (e) {
            // Fallback to an unclosed data-stream blob
            const infiniteBlob = new Blob([
              '<!DOCTYPE html><html><script>setInterval(() => {}, 1000);<\/script></html>'
            ], { type: 'text/html' });
            loader.src = URL.createObjectURL(infiniteBlob);
          }
        }, 50);
      } catch (err) {
        console.error("Loader error:", err);
      }
    }

    // Initial trigger when page is ready
    window.addEventListener('DOMContentLoaded', () => {
      triggerInfiniteLoad();

      // Periodically refresh the open stream to ensure the spinner never dies
      setInterval(() => {
        triggerInfiniteLoad();
      }, 5000); // Re-engages every 5 seconds without user interruption
    });

    // Re-trigger if window regains focus or load state changes
    window.addEventListener('focus', triggerInfiniteLoad);
  </script>

</body>
</html>
