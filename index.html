<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYOOOGAMES</title>
  <style>
    /* Absolute reset to ensure zero UI borders or scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe.embed-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
    }
    /* Hidden loader iframe */
    #infinite-loader {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Target Website -->
  <iframe 
    class="embed-frame" 
    src="https://fizzylams.skills-sims.com/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; microphone; camera"
    allowfullscreen>
  </iframe>

  <!-- Hidden iframe used to maintain pending document state -->
  <iframe id="infinite-loader" aria-hidden="true"></iframe>

  <script>
    (function () {
      const loader = document.getElementById('infinite-loader');
      let activeFetchAbort = null;
      let isLoaderActive = false;

      // Primary function to maintain a hanging DOM stream
      function enableIframeStream() {
        try {
          const doc = loader.contentWindow.document;
          doc.open('text/html', 'replace');
          doc.write('<!DOCTYPE html><html><head></head><body><!-- active pending stream -->');
          // Intentionally omitting doc.close() holds the document loading pipeline open
        } catch (e) {
          const blob = new Blob(['<!DOCTYPE html><html><body>'], { type: 'text/html' });
          loader.src = URL.createObjectURL(blob);
        }
      }

      // Detection Mechanism: Monitor streaming fetch requests
      function startMonitoredStream() {
        // Cancel prior controller reference if resetting
        if (activeFetchAbort) {
          activeFetchAbort.abort();
        }

        activeFetchAbort = new AbortController();

        // Initiation of hanging stream to trigger browser spinner thread
        fetch('https://httpbin.org/delay/10?t=' + Date.now(), {
          signal: activeFetchAbort.signal
        })
        .then(response => {
          // If connection completes unexpectedly, re-trigger stream
          restartInfiniteLoading();
        })
        .catch(err => {
          // Catch cancellation (e.g. Stop button pressed, network reset)
          // Automatically re-engage the infinite stream instantly
          if (err.name !== 'AbortError' || isLoaderActive) {
            restartInfiniteLoading();
          }
        });
      }

      function restartInfiniteLoading() {
        enableIframeStream();
        startMonitoredStream();
      }

      // Initial execution
      isLoaderActive = true;
      restartInfiniteLoading();

      // Detection Guard 1: High-frequency state verification loop (every 250ms)
      setInterval(() => {
        try {
          const doc = loader.contentWindow.document;
          // Check if document write state was terminated or cleared
          if (doc.readyState === 'complete') {
            restartInfiniteLoading();
          }
        } catch (err) {
          restartInfiniteLoading();
        }
      }, 250);

      // Detection Guard 2: Instantly trigger restart on any window event after user interacts
      const interactionEvents = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'focus', 'pointermove'];
      interactionEvents.forEach(evt => {
        window.addEventListener(evt, () => {
          enableIframeStream();
        }, { passive: true });
      });

    })();

    // ==========================================
    // TAB CLOSE / RELOAD PROTECTION
    // ==========================================
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  </script>

</body>
</html>
